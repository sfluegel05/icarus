# nginx site for ICaRuS, proxying to the app on 127.0.0.1:8000.
# Put it in /etc/nginx/sites-available/, symlink to sites-enabled/, `nginx -t`,
# reload, then add TLS (e.g. `certbot --nginx -d icarus.example.org`).
server {
    listen 80;
    server_name icarus.example.org;

    # Served at the site root:
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # Or, served under a sub-path such as https://example.org/icarus/ (the app uses
    # relative URLs, so the prefix only has to be stripped). Use this instead of
    # the block above:
    #
    # location = /icarus { return 301 /icarus/; }
    # location /icarus/ {
    #     proxy_pass http://127.0.0.1:8000/;   # trailing slash strips /icarus
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 120s;
    #     client_max_body_size 1m;
    # }
}
